name: release

# v로 시작하는 태그를 push 하면 Windows 설치 파일을 빌드하고 릴리스를 만든다.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 프론트엔드 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 빌드 및 릴리스
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "m2mm ${{ github.ref_name }}"
          releaseBody: "MIDI를 마비노기 모바일 MML로 변환하는 앱입니다. 아래 설치 파일을 받아 설치하세요. (설치 후에는 새 버전이 나오면 앱이 켜질 때 자동으로 업데이트됩니다.)"
          releaseDraft: false
          prerelease: false
